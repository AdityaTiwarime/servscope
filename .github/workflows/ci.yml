name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servscope
          POSTGRES_PASSWORD: servscope
          POSTGRES_DB: servscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U servscope" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen --python 3.12
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -v
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://servscope:servscope@localhost:5432/servscope_test

  ui:
    name: dashboard lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: secrets and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: secret scan (gitleaks 8.30.1, whole history)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: Python dependencies, known vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit==2.9.0 -r requirements.txt --require-hashes --disable-pip --progress-spinner off
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: dashboard dependencies, known vulnerabilities (npm audit)
        working-directory: ui
        run: npm audit --audit-level=high

  stack:
    name: docker compose end-to-end
    needs: [checks, ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: create .env from the example (failure scenarios on, fresh random secrets)
        run: |
          cp .env.example .env
          sed -i "s/^SERVSCOPE_INGEST_TOKEN=.*/SERVSCOPE_INGEST_TOKEN=$(openssl rand -hex 24)/" .env
          sed -i "s/^SERVSCOPE_DB_PASSWORD=.*/SERVSCOPE_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          ADMIN=$(openssl rand -hex 24)
          sed -i "s/^SERVSCOPE_ADMIN_TOKEN=.*/SERVSCOPE_ADMIN_TOKEN=$ADMIN/" .env
          sed -i "s/^SERVSCOPE_FAULT_TOKEN=.*/SERVSCOPE_FAULT_TOKEN=$(openssl rand -hex 24)/" .env
          sed -i "s/^SERVSCOPE_FAILURE_INJECTION=.*/SERVSCOPE_FAILURE_INJECTION=true/" .env
          echo "::add-mask::$ADMIN"
          echo "SERVSCOPE_ADMIN_TOKEN=$ADMIN" >> "$GITHUB_ENV"
          INGEST=$(grep '^SERVSCOPE_INGEST_TOKEN=' .env | cut -d= -f2)
          echo "::add-mask::$INGEST"
          echo "SERVSCOPE_INGEST_TOKEN=$INGEST" >> "$GITHUB_ENV"
      - name: start the stack
        run: docker compose up --build --detach
      - name: wait until the shop and ServScope answer
        run: |
          timeout 300 bash -c 'until curl -sf localhost:8080/healthz && curl -sf localhost:8000/readyz; do sleep 2; done'
      # --no-deps: `run` must not touch the running stack. Without it, Compose may recreate
      # the shop's containers, and the steady traffic then sees real failures mid-restart.
      - name: smoke test (checkout -> trace in PostgreSQL)
        run: timeout 300 docker compose run --rm --no-deps smoke
      - name: scripted incident (payments timeout -> alert -> evidence -> fix -> resolved)
        run: timeout 900 docker compose run --rm --no-deps incident-demo
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: dashboard end-to-end (Playwright, real browser, real stack)
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          SERVSCOPE_URL: http://localhost:8000
          GATEWAY_URL: http://localhost:8080
          SERVSCOPE_ADMIN_TOKEN: ${{ env.SERVSCOPE_ADMIN_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - name: failure drills (stop, kill and flood the running stack; metrics must equal spans)
        run: timeout 1200 uv run --frozen python scripts/failure_drills.py --compose --json drills.json
      - name: keep the drill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-drills
          path: drills.json
          if-no-files-found: ignore
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: stop
        if: always()
        run: docker compose down --volumes
